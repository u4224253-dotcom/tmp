name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIP_FILE: AndroidLiquidGlass.zip
  PROJECT_DIR: AndroidLiquidGlass

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Repo hanya berisi zip; ekstrak di runner saat build
      - name: Extract project zip
        run: |
          test -f "$ZIP_FILE" || { echo "::error::$ZIP_FILE tidak ditemukan di root repo"; ls -la; exit 1; }
          unzip -q "$ZIP_FILE"
          test -d "$PROJECT_DIR" || { echo "::error::Folder $PROJECT_DIR tidak ada di dalam zip"; ls -la; exit 1; }
          ls -la "$PROJECT_DIR"

      # Pastikan gradle-wrapper.jar cocok dengan checksum resmi Gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      # compileSdk 37 & build-tools 37.0.0 akan diunduh otomatis oleh AGP
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: ${{ env.PROJECT_DIR }}/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release-unsigned
          path: ${{ env.PROJECT_DIR }}/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
